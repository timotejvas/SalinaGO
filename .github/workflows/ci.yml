# Checks every push and pull request the same way as on a computer:
# known vulnerabilities in the packages, the formatting, the common mistakes and the types.
name: CI

on: [push, pull_request]

# the checks only read the code
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Known vulnerabilities in the packages
        run: npm audit --audit-level=high
      - name: Formatting
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Types and build
        run: npm run build
